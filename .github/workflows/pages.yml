name: Deploy KOI site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5

      - name: Test the deploy gate
        run: python3 scripts/test_verify_site.py

      # The glide decoder is the demo's whole point and the one piece of real
      # algorithm on the site. It is tested against the shipped dictionary.
      - name: Test the glide decoder
        run: node scripts/test_glide_decoder.mjs

      # The committed HTML is what ships, so it has to be exactly what the
      # content modules produce. A re-render that changes any tracked file means
      # someone edited content without re-rendering, or edited HTML by hand.
      - name: Check committed HTML matches the content source
        run: |
          python3 scripts/render_site.py
          changes="$(git status --porcelain --untracked-files=all -- . ':(exclude)scripts')"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Rendered output differs from committed HTML. Run scripts/render_site.py and commit the result."
            exit 1
          fi

      - name: Validate static site contract
        run: python3 scripts/verify_site.py .

      - name: Assemble Pages artifact
        run: |
          mkdir _site
          cp -R index.html 404.html assets privacy support terms en CNAME robots.txt sitemap.xml _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
